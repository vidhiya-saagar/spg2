name: Ruby CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.5
          bundler-cache: true
      - name: RuboCop
        run: bundle exec rubocop

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build development image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: development
          tags: spg2-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run via `docker run` (not `docker compose run`) so the named bundle
      # volume is not mounted — tests use gems baked into the image instead
      # of reinstalling gems into an empty volume on every CI run.
      # The entrypoint handles db:drop db:create db:schema:load for RAILS_ENV=test.
      - name: Run test suite
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -e RAILS_ENV=test \
            spg2-web:latest \
            bundle exec rspec
