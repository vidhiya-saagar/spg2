name: Ruby CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.5
          bundler-cache: true
      - name: RuboCop
        run: bundle exec rubocop

  lint-dockerfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker compose build

      # Run tests via `docker run` (not `docker compose run`) so the named
      # bundle volume is not mounted. This lets the container use the gems
      # baked into the image at /usr/local/bundle rather than reinstalling
      # all 137 gems into an empty volume on every CI run.
      - name: Run test suite
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            spg2-web \
            bundle exec rspec
